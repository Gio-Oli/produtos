<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque de Produtos</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <!-- Menu de Abas -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link" href="/">Cadastrar Produto</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active fw-bold" href="/estoque">Estoque de Produtos</a>
        </li>
    </ul>

    <!-- Tabela de Estoque -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Produtos Cadastrados</h5>
            <a href="/" class="btn btn-sm btn-primary">+ Novo Produto</a>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Tamanho</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod : ${produtos}">
                    <td th:text="${prod.id}">1</td>
                    <td th:text="${prod.nome}">Camiseta</td>
                    <td th:text="${prod.tipo}">Vestuário</td>
                    <td th:text="${prod.tamanho}">M</td>
                    <td th:text="${prod.quantidade}">10</td>
                    <td>
                        <a th:href="@{/excluir/{id}(id=${prod.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Deseja remover este produto?')">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="6" class="text-center text-muted">Nenhum produto cadastrado no estoque.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
